; MT5 walk-forward preset: optimize TP%% x SL%% on the FIRST 2/3 of the
; window (Jan-Apr 2026, in-sample) and auto-validate every pass on the
; LAST 1/3 (May-Jun 2026, out-of-sample) that the optimizer never saw.
; ForwardMode: 0=off 1=1/2 2=1/3 3=1/4 4=custom(ForwardDate)
;
; Read the "Forward Results" tab in the tester: the TP 1.0-1.25 x SL 8-10
; plateau must remain profitable there. If the plateau vanishes forward,
; the in-sample edge is overfit - stop before the demo stage.

[Tester]
Expert=XAUUSD_DayOpen_Long_Robust.ex5
Symbol=XAUUSD.
Period=D1
Optimization=1
OptimizationCriterion=6
ForwardMode=2
Model=1
Deposit=1000
Currency=USD
Leverage=100
FromDate=2026.01.01
ToDate=2026.06.27
Report=Report_walkforward
ReplaceReport=1
ShutdownTerminal=1

[TesterInputs]
; value || start || step || stop || optimize(Y/N)
InpDailyProfitPct=1.0||0.25||0.25||5.0||Y
InpMaxDailyLossPct=9.0||2.0||1.0||10.0||Y
InpTrendFilter=1
InpRunTag=wf
