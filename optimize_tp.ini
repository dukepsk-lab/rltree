; MT5 Strategy Tester preset: optimize the daily TP%% (and disaster SL%%)
; of XAUUSD_DayOpen_Long_Robust. Compile the EA in MetaEditor first.
;
; OptimizationCriterion=6 -> "Custom max": uses the DD-penalized score
; returned by OnTester (netProfit * (100 - maxDD%%) / 100), so a pass that
; profited through near-ruin drawdowns cannot win the optimization.
; Each pass also writes <Common>\Files\results_opt_tp<TP>_sl<SL>.csv.
;
; Guidance from the Monte Carlo sweep (optimize_tp_sweep.py): the sane
; region is TP 0.25-3%% with SL 2-5%%. Large TP+SL combos only look good
; in relentless uptrends and carry double-digit ruin odds - if the
; optimizer picks a corner cell, distrust it and check its DD.

[Tester]
Expert=XAUUSD_DayOpen_Long_Robust.ex5
Symbol=XAUUSD.
Period=D1
Optimization=1
OptimizationCriterion=6
Model=1
Deposit=200
Currency=USD
Leverage=100
FromDate=2026.01.01
ToDate=2026.06.27
Report=Report_opt_tp
ReplaceReport=1
ShutdownTerminal=1

[TesterInputs]
; value || start || step || stop || optimize(Y/N)
InpDailyProfitPct=1.0||0.25||0.25||5.0||Y
InpMaxDailyLossPct=5.0||2.0||1.0||10.0||Y
InpTrendFilter=1
InpRunTag=opt
