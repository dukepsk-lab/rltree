; MT5 single backtest: the multi-TF EA on the recommended H4 configuration,
; 2026-only window, real ticks. Purpose: arbitrate what H1-bar data cannot -
; grid_backtest.py bounds the 2026 result at [-30%, -15%] for this cell, and
; the earlier IUX D1 optimization claimed +64% for overlapping months, so the
; tick tester is the tie-breaker. Compile XAUUSD_BarOpen_MultiTF.mq5 first.
;
; Note Period=H4 sets the CHART timeframe; the EA trades InpTradeTF below.

[Tester]
Expert=XAUUSD_BarOpen_MultiTF.ex5
Symbol=XAUUSD.
Period=H4
Optimization=0
Model=1
Deposit=1000
Currency=USD
Leverage=100
FromDate=2026.01.01
ToDate=2026.07.03
Report=Report_2026_H4
ReplaceReport=1
ShutdownTerminal=1

[TesterInputs]
InpTradeTF=16388
InpDirection=0
InpProfitPctPerBar=3.0
InpMaxLossPctPerBar=9.0
InpTrendFilter=1
InpRunTag=h4_2026
